# dbt project — CricketWorldCup Analytics (Stage 12)

name: cricket_worldcup_analytics
version: "0.12.0"
config-version: 2
profile: cricket_worldcup_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

vars:
  # Optional filter — leave null for all tournaments present in the DuckDB file
  tournament_id: null

models:
  cricket_worldcup_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
